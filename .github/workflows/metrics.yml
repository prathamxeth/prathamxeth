name: Metrics
on:
  # Schedule updates daily at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Base profile metrics (languages, lines of code, notable repositories)
      - name: Generate Core Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: prathamxeth
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_notable: yes
          plugin_notable_repositories: yes

      # 2. 3D Isometric Contribution Calendar
      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: prathamxeth
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
