<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 112" width="290" height="112" role="img" aria-label="prathamxeth.dev">
  <style>
    
    .font-display { font-family: 'BrandDisplay', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'BrandMono', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }
    @keyframes scanRow {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .card-enter {
      opacity: 0;
      animation: cardEnter 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .pulse {
      animation: pulseDot 2.2s ease-in-out infinite;
    }
    
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
  <g class="card-enter" style="animation-delay:0.30s">
    <rect x="0.5" y="0.5" width="289" height="111" rx="12" fill="#0E121B" stroke="#22293A" />
    <rect x="0.5" y="0.5" width="5" height="111" rx="2.5" fill="#818CF8" />

    <text x="20" y="29" class="font-mono" fill="#818CF8" font-size="10.5" letter-spacing="1.1">01 // PORTFOLIO</text>
    <text x="270" y="29" class="font-mono" fill="#5E677D" font-size="13" text-anchor="end">↗</text>

    <text x="20" y="60" class="font-display" fill="#F4F5F8" font-size="21" font-weight="700" letter-spacing="-0.3">
      prathamxeth.dev
    </text>

    <text x="20" y="85" class="font-mono" fill="#949DB2" font-size="11.5">
      Architecture &amp; Case Studies
    </text>
  </g>
</svg>