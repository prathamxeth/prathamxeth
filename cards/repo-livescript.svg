<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 142" width="900" height="142" role="img" aria-label="Featured Repository LiveScript">
  <style>
    
    .font-display { font-family: 'BrandDisplay', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'BrandMono', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }
    @keyframes scanRow {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .card-enter {
      opacity: 0;
      animation: cardEnter 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .pulse {
      animation: pulseDot 2.2s ease-in-out infinite;
    }
    
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
  <g class="card-enter" style="animation-delay:1.62s">
    <rect x="0.5" y="0.5" width="899" height="141" rx="14" fill="#0E121B" stroke="#22293A" />
    <rect x="0.5" y="0.5" width="5" height="141" rx="2.5" fill="#F59E0B" />

    <text x="30" y="34" class="font-mono" fill="#F59E0B" font-size="10.5" letter-spacing="1.1">
      02 // MACOS AUDIO INTELLIGENCE
    </text>

    <text x="30" y="64" class="font-display" fill="#F4F5F8" font-size="22" font-weight="700">
      prathamxeth/LiveScript
    </text>

    <text x="30" y="88" class="font-mono" fill="#949DB2" font-size="12">
      Dynamic Notch Audio Transcription &amp; Neural Translation for macOS with live waveform visualizers.
    </text>

    <rect x="30" y="102" width="84.8" height="22" rx="5" fill="#090B10" stroke="#323C54" /><text x="40" y="116" class="font-mono" fill="#949DB2" font-size="10.5">macOS 14+</text><rect x="122.8" y="102" width="84.8" height="22" rx="5" fill="#090B10" stroke="#323C54" /><text x="132.8" y="116" class="font-mono" fill="#949DB2" font-size="10.5">Swift 6.0</text><rect x="215.6" y="102" width="113.6" height="22" rx="5" fill="#090B10" stroke="#323C54" /><text x="225.6" y="116" class="font-mono" fill="#949DB2" font-size="10.5">Apple Silicon</text><rect x="337.2" y="102" width="120.8" height="22" rx="5" fill="#090B10" stroke="#323C54" /><text x="347.2" y="116" class="font-mono" fill="#949DB2" font-size="10.5">Audio Pipeline</text>

    <circle cx="730" cy="58" r="5" fill="#FA7343" />
    <text x="742" y="62" class="font-mono" fill="#F4F5F8" font-size="12">Swift</text>
    <text x="870" y="62" class="font-mono" fill="#949DB2" font-size="12" text-anchor="end">
      ★ 0 · ⑂ 0
    </text>
    <text x="870" y="116" class="font-mono" fill="#F59E0B" font-size="11.5" text-anchor="end">
      EXPLORE REPO ↗
    </text>
  </g>
</svg>